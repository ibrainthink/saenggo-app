<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>아이브레인 생각의고수 수업기록부</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22314F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#22314F; --cream:#F7F5EF; --paper:#FFFEFB; --line:#E1DBC9;
  --muted:#8A8270; --gold:#8B6F2E; --red:#A3392E; --green:#3F6B4A;
  --amber:#C6912F; --soft:#EEE9DA; --font-scale:1;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--font-scale))} body{margin:0;background:var(--cream);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;line-height:1.5}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:0 auto;padding:24px 16px 72px}
.header{border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:18px}
.title{font-family:Georgia,"Noto Serif KR",serif;font-size:1.75rem;font-weight:800}
.subtitle{font-size:.95rem;color:var(--muted);margin-top:5px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{border:1px solid #D8D1BE;background:#fff;color:#756d5d;border-radius:6px;padding:9px 13px}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.btn.gold{color:var(--gold);border-color:#D9C79A}
.input{border:1px solid #D8D1BE;background:#fff;color:var(--navy);border-radius:6px;padding:10px 11px;outline:none;direction:ltr;text-align:left;unicode-bidi:plaintext;ime-mode:active}
.search{width:100%}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:15px 16px;margin-bottom:11px}
.student-card{display:flex;gap:12px;align-items:center}
.grow{flex:1}
.small{font-size:.9rem;color:var(--muted)}
.book-name{font-family:Georgia,"Noto Serif KR",serif;font-weight:800;font-size:1.12rem}
.section-title{font-family:Georgia,"Noto Serif KR",serif;font-weight:800;font-size:1.05rem;margin:18px 0 10px}
.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.progress > div{height:100%}
.graph-preview-card{margin-top:14px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.graph-preview-card img{display:block;width:100%;max-width:520px;height:auto;margin:10px auto 0;border-radius:10px;border:1px solid #e6dfcf;background:#fff}
.graph-preview-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.segmented{height:22px;background:var(--soft);border-radius:999px;overflow:hidden;display:flex;border:1px solid #e3dcc8}
.segment{height:100%;min-width:3px;position:relative}
.segment + .segment{border-left:1px solid rgba(255,255,255,.85)}
.legend{display:flex;flex-wrap:wrap;gap:7px 12px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.88rem;color:#6f6858}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.form{background:#FBF9F3;border:1px dashed #D8D1BE;border-radius:8px;padding:13px;margin:10px 0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:#7A7261}
.danger{color:var(--red)}
.muted{color:#B7AF9B}
.empty{text-align:center;padding:42px 18px;color:#B7AF9B}
.divider{border-top:2px solid #D8D1BE;margin:28px 0 16px}
.session-list{border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
.session-row{display:grid;grid-template-columns:52px 1fr 70px 38px;gap:8px;align-items:center;padding:6px 0;font-size:.9rem}
.mini-bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.stamp{position:absolute;right:13px;top:10px;width:52px;height:52px;border:3px solid var(--red);color:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Noto Serif KR",serif;font-weight:800;transform:rotate(-13deg);opacity:.82}
.relative{position:relative}
.badge{font-size:.8rem;font-weight:800;border:1px solid currentColor;border-radius:5px;padding:2px 7px}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
.accessibility{position:sticky;top:30px;z-index:20;background:rgba(247,245,239,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.accessibility .label{font-size:.9rem;color:var(--muted);font-weight:700}
.font-btn{min-width:44px;min-height:42px;font-size:1rem;font-weight:800}
.version{margin-left:auto;font-size:.78rem;color:var(--muted)}
.file-input{display:none}
.notice{font-size:.85rem;color:var(--green);font-weight:700}
.hidden{display:none!important}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.info-item{background:#FBF9F3;border:1px solid var(--line);border-radius:8px;padding:10px}
.info-label{font-size:.78rem;color:var(--muted);margin-bottom:3px}
.info-value{font-weight:800}
.note-item{border-left:4px solid var(--navy);padding:10px 12px;background:#FBF9F3;border-radius:0 8px 8px 0;margin:8px 0}
.note-date{font-size:.82rem;color:var(--muted);font-weight:700}
.note-text{white-space:pre-wrap;margin-top:4px}
textarea.input{width:100%;min-height:90px;resize:vertical}
@media(max-width:520px){.info-grid{grid-template-columns:1fr}}
@media(max-width:520px){
  .app{padding:18px 12px 70px}
  .toolbar{flex-wrap:wrap}
  .toolbar .search{min-width:180px}
  .session-row{grid-template-columns:48px 1fr 60px 28px}
  .btn{padding:8px 10px}
}

.voice-panel{background:#EEF3FB;border:1px solid #C8D4E6;border-radius:10px;padding:12px 14px;margin:0 0 16px}
.voice-main{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.voice-btn{background:#22314F;color:#fff;border:0;border-radius:8px;padding:11px 15px;font-weight:800;display:inline-flex;align-items:center;gap:7px}
.voice-btn.listening{background:#A3392E}
.voice-text{font-size:13px;color:#5f6570;line-height:1.55;margin-top:8px}
.voice-help{font-size:12px;color:#7A7261;margin-top:7px;line-height:1.55}
.voice-undo{margin-left:auto}

.voice-review{margin-top:10px;background:#fff;border:1px solid #D8D1BE;border-radius:8px;padding:10px 11px}
.voice-review .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.voice-review label{font-size:12px;color:#7A7261;display:block;margin-bottom:4px}
.voice-review input,.voice-review select,.voice-review textarea{width:100%;border:1px solid #D8D1BE;border-radius:6px;padding:9px 10px;background:#fff;color:#22314F}
.voice-review textarea{min-height:74px;resize:vertical}
.voice-review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
@media(max-width:520px){.voice-review .row2{grid-template-columns:1fr}}

.mic-inline{border:1px solid #C8D4E6;background:#EEF3FB;color:#22314F;border-radius:7px;padding:8px 10px;font-weight:700;white-space:nowrap}
.mic-inline.listening{background:#FCE9E7;color:#A3392E;border-color:#E3B7AE}
.voice-field-row{display:flex;gap:7px;align-items:flex-start}
.voice-field-row textarea,.voice-field-row input{flex:1}

.always-top-student{
  position:sticky; top:0; left:0; right:0; z-index:9999;
  background:#F7F5EF; border-bottom:1px solid #D8D1BE;
  padding:2px 10px; box-shadow:0 2px 8px rgba(34,49,79,.08);
}
.always-top-student-inner{max-width:640px;margin:0 auto}
.student-top-btn{
  width:100%; min-height:26px; background:#22314F; color:white;
  border:0; border-radius:6px; font-size:12px; font-weight:800;
}
.fab-student-list{
  position:fixed; left:6px; top:50%; transform:translateY(-50%); z-index:10000;
  background:#22314F; color:#fff; border:none; border-radius:10px;
  padding:12px 6px; font-size:12px; font-weight:800; line-height:1.4;
  box-shadow:0 3px 10px rgba(0,0,0,.3); writing-mode:vertical-rl; letter-spacing:2px;
}

.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.feedback-grid .wide{grid-column:1/-1}.preview{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px;min-height:130px;line-height:1.65}.copy-btn{width:100%;font-size:1.05rem;padding:12px}.checkline{display:flex;align-items:center;gap:7px;font-size:.92rem}.checkline input{width:20px;height:20px}.notice-box{background:#FFF9E8;border:1px solid #E8D7A5;border-radius:8px;padding:12px;margin-top:12px}@media(max-width:520px){.feedback-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="always-top-student">
  <div class="always-top-student-inner">
    <button class="student-top-btn" onclick="goStudentListTop()">👥 학생 목록</button>
  </div>
</div>
<button class="fab-student-list" onclick="goStudentListTop()">👥 학생목록</button>
<div id="app" class="app"></div>
<script>
const KEY="academy-data-v2";
const COLORS=["#22314F","#A3392E","#3F6B4A","#8B6F2E","#5B4B8A","#2E7D8C","#C6912F","#6B4226"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pct=(a,b)=>!b?0:Math.min(100,Math.round(a/b*100));
const today=()=>new Date().toISOString().slice(0,10);
function firstDateFromDatesField(datesStr,fallbackYMD){
  const fb=fallbackYMD||today();
  if(!datesStr) return fb;
  const m=datesStr.match(/(\d{1,2})\/(\d{1,2})/);
  if(!m) return fb;
  const year=fb.slice(0,4);
  const mm=String(m[1]).padStart(2,"0"), dd=String(m[2]).padStart(2,"0");
  return `${year}-${mm}-${dd}`;
}
let state={students:[],books:[],sessions:[],notes:[],payments:[],feedbacks:[],commonNotice:"",academyLogo:null,shareFontScale:1,selectedId:null,query:"",fontScale:1,noticeFontScale:1,detailTab:"books",editingFeedbackId:null,showDatesPicker:false,showPayDatePicker:false,datesPickerSelected:[],datesPickerMonth:null,payDatePickerMonth:null};
const APP_VERSION="2.12.0";
const SETTINGS_KEY="academy-settings-v1";

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(d) state={...state,...d,notes:Array.isArray(d.notes)?d.notes:[],payments:Array.isArray(d.payments)?d.payments:[],feedbacks:Array.isArray(d.feedbacks)?d.feedbacks:[],commonNotice:d.commonNotice||"",academyLogo:d.academyLogo||null,shareFontScale:Number(d.shareFontScale)||1,selectedId:null,query:""};
    const settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"null");
    if(settings?.fontScale) state.fontScale=Number(settings.fontScale)||1;
    if(settings?.noticeFontScale) state.noticeFontScale=Number(settings.noticeFontScale)||1;
    applyFontScale();
  }catch(e){ console.warn(e); }
  cloudMaybeAutoLogin();
}
function save(){
  const payload={students:state.students,books:state.books,sessions:state.sessions,notes:state.notes,payments:state.payments,feedbacks:state.feedbacks,commonNotice:state.commonNotice,academyLogo:state.academyLogo||null,shareFontScale:state.shareFontScale||1};
  localStorage.setItem(KEY,JSON.stringify(payload));
  localStorage.setItem(KEY+"-last-good",JSON.stringify(payload));
  cloudQueueSync(payload);
}
function applyFontScale(){document.documentElement.style.setProperty("--font-scale",String(state.fontScale||1))}
function setFontScale(delta){
  state.fontScale=Math.max(.9,Math.min(1.6,Math.round(((state.fontScale||1)+delta)*10)/10));
  localStorage.setItem(SETTINGS_KEY,JSON.stringify({fontScale:state.fontScale,noticeFontScale:state.noticeFontScale}));
  applyFontScale(); render();
}
function resetFontScale(){state.fontScale=1;localStorage.setItem(SETTINGS_KEY,JSON.stringify({fontScale:1,noticeFontScale:state.noticeFontScale}));applyFontScale();render()}
function setNoticeFontScale(delta){
  state.noticeFontScale=Math.max(.9,Math.min(2.2,Math.round(((state.noticeFontScale||1)+delta)*10)/10));
  localStorage.setItem(SETTINGS_KEY,JSON.stringify({fontScale:state.fontScale,noticeFontScale:state.noticeFontScale}));
  render();
}
function exportData(){
  const data={app:"생고 수업기록부",version:APP_VERSION,exportedAt:new Date().toISOString(),students:state.students,books:state.books,sessions:state.sessions,notes:state.notes,payments:state.payments,feedbacks:state.feedbacks,commonNotice:state.commonNotice,academyLogo:state.academyLogo||null,shareFontScale:state.shareFontScale||1};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`생고_수업기록_백업_${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importData(input){
  const file=input.files&&input.files[0]; if(!file)return;
  const reader=new FileReader(); reader.onload=()=>{try{
    const d=JSON.parse(reader.result);
    if(!Array.isArray(d.students)||!Array.isArray(d.books)||!Array.isArray(d.sessions)) throw new Error("형식 오류");
    if(!confirm(`학생 ${d.students.length}명의 백업을 복원할까요? 현재 자료는 안전용으로 따로 보관됩니다.`))return;
    localStorage.setItem(KEY+"-before-import-"+Date.now(),JSON.stringify({students:state.students,books:state.books,sessions:state.sessions,notes:state.notes,payments:state.payments,feedbacks:state.feedbacks,commonNotice:state.commonNotice}));
    state.students=d.students; state.books=d.books; state.sessions=d.sessions; state.notes=Array.isArray(d.notes)?d.notes:[]; state.payments=Array.isArray(d.payments)?d.payments:[]; state.feedbacks=Array.isArray(d.feedbacks)?d.feedbacks:[]; state.commonNotice=d.commonNotice||""; state.academyLogo=d.academyLogo||null; state.shareFontScale=Number(d.shareFontScale)||1; state.selectedId=null; save(); render(); alert("복원이 완료되었습니다.");
  }catch(e){alert("백업 파일을 읽지 못했습니다.");} input.value=""}; reader.readAsText(file);
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function covered(bookId){return state.sessions.filter(s=>s.bookId===bookId).reduce((a,s)=>a+Number(s.amount),0)}
function bookSessions(bookId){return state.sessions.filter(s=>s.bookId===bookId).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt)}
function status(p){return p>=100?["완독","#8B6F2E"]:p>=70?["순조","#3F6B4A"]:p>=40?["보통","#C6912F"]:["지연","#A3392E"]}
function ageFromBirth(birth){
  if(!birth)return "미입력";
  const b=new Date(birth), t=new Date(); if(Number.isNaN(b.getTime()))return "미입력";
  let age=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth(); if(m<0||(m===0&&t.getDate()<b.getDate())) age--;
  return `${Math.max(0,age)}세`;
}
function studentNotes(studentId){return state.notes.filter(n=>n.studentId===studentId).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt)}
function studentPayments(studentId){return state.payments.filter(p=>p.studentId===studentId).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt)}
function studentFeedbacks(studentId){return state.feedbacks.filter(f=>f.studentId===studentId).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
function feedbackLessonHistory(studentId){
  const rows=[];
  studentFeedbacks(studentId).forEach(f=>{
    const dates=String(f.dates||"").split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    if(dates.length) rows.push({savedAt:f.savedAt||"",rounds:f.rounds||"",dates:dates.join(", ")});
  });
  return rows;
}
function feedbackBookHistory(studentId){return studentFeedbacks(studentId).filter(f=>String(f.book||"").trim())}
function activeBookMini(studentId){
  // 구버전 교재는 status 값이 없을 수 있으므로 완료(done)만 제외해 모두 진행 중으로 취급
  const books=state.books.filter(b=>b.studentId===studentId && b.status!=="done");
  if(!books.length)return '<div style="padding:10px 0;font-weight:700">진행 중인 교재가 없습니다.</div>';
  return books.map(b=>{
    const total=Math.max(Number(b.totalPages||b.total||0),1);
    const done=Math.max(0,covered(b.id));
    const p=Math.min(100,Math.round(done/total*100));
    return `<div style="margin:12px 0 15px;padding:10px;background:#fffaf0;border-radius:10px">
      <div class="row between" style="gap:10px"><span style="font-weight:900;font-size:1rem">📘 ${esc(b.name)}</span><b>${p}%</b></div>
      <div style="height:14px;margin-top:8px;background:#eee7d7;border:1px solid #d7c9a8;border-radius:999px;overflow:hidden"><div style="height:100%;width:${p}%;background:#3F6B4A;border-radius:999px;min-width:${p>0?4:0}px"></div></div>
      <div class="small" style="margin-top:5px;text-align:right">${done} / ${total}쪽</div>
    </div>`;
  }).join('');
}
function toggleFbHistory(id){const el=document.getElementById(id);if(el)el.style.display=el.style.display==='none'?'block':'none'}


function render(){
  const root=document.getElementById("app");
  if(!cloudAuthChecked){
    root.innerHTML=`<div class="card" style="text-align:center;padding:40px 16px">불러오는 중...</div>`;
    return;
  }
  if(!cloudUser){
    root.innerHTML=loginGateView();
    return;
  }
  const student=state.students.find(s=>s.id===state.selectedId);
  root.innerHTML=`
    <div class="accessibility">
      <span class="label">글자 크기</span>
      <button class="btn font-btn" onclick="setFontScale(-0.1)" aria-label="글자 작게">A−</button>
      <button class="btn font-btn" onclick="resetFontScale()" aria-label="기본 크기">기본</button>
      <button class="btn primary font-btn" onclick="setFontScale(0.1)" aria-label="글자 크게">A＋</button>
      <button class="btn" onclick="showClassLog()">📅 수업일 기록</button>
      <button class="btn" onclick="showLogoPanel()">🖼 학원 로고</button>
      <button class="btn ${cloudUser?'gold':''}" onclick="showCloudPanel()">☁️ ${esc(cloudUser.email)}</button>
      <button class="btn" onclick="exportData()">자료 백업</button>
      <button class="btn" onclick="document.getElementById('restoreFile').click()">자료 복원</button>
      <input id="restoreFile" class="file-input" type="file" accept="application/json,.json" onchange="importData(this)">
      <span class="version">v${APP_VERSION} · ${Math.round((state.fontScale||1)*100)}%</span>
    </div>
    <div class="header">
      <img src="${state.academyLogo||'logo.png'}" alt="학원 로고" style="display:block;width:100%;max-width:520px;height:auto;margin:0 auto 10px">
      <div class="title">생고 수업기록부</div>
      <div class="subtitle">학생별 · 교재별 · 날짜별 수업량과 교재 진도를 한눈에 확인하세요</div>
      <div class="notice">업데이트해도 기존 학생 자료는 그대로 유지됩니다.</div>
    </div>
    <div class="voice-panel">
      <div class="voice-main">
        <button id="voiceBtn" class="voice-btn" onclick="startVoiceRecord()">🎤 말로 수업 기록</button>
        <button id="voiceUndoBtn" class="btn voice-undo hidden" onclick="undoVoiceRecord()">↩ 방금 기록 취소</button>
      </div>
      <div class="voice-help">예: “장시완 멘사 오늘 세 장 풀었어” → 6쪽 · “장시완 멘사 오늘 3쪽 풀었어” → 3쪽</div>
      <div id="voiceStatus" class="voice-text">진도·상담·특이사항·결제·교재 완료까지 음성 입력 가능 · 긴 상담 내용은 군더더기를 줄여 간단히 정리한 뒤 확인/수정해서 저장합니다.</div>
    </div>
    ${state.showLogo?logoView():(state.showCloud?cloudView():(state.showClassLog?classLogView():(student?detailView(student):listView())))}
  `;
}
function showLogoPanel(){ state.showLogo=true; state.selectedId=null; state.showCloud=false; state.showClassLog=false; render(); window.scrollTo(0,0); }
function logoView(){
  return `<div class="row between wrap" style="margin-bottom:10px"><div class="section-title" style="margin:0">🖼 학원 로고 설정</div><button class="btn" onclick="goStudentListTop()">← 학생 목록</button></div>
  <div class="card">
    <div class="small" style="margin-bottom:12px">내 학원 로고 이미지를 올리면, 화면 상단과 학부모에게 보내는 진도 그림에 이 로고가 표시돼요. (가로로 긴 이미지 권장)</div>

function classLogDatesSet(){
  const set={};
  state.sessions.forEach(s=>{ set[s.date]=(set[s.date]||0)+1; });

}
function classLogMonthShift(delta){
  const [y,m]=state.classLogMonth.split("-").map(Number);
  const d=new Date(y,m-1+delta,1);
  state.classLogMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  state.classLogSelectedDate=null;state.classLogSelectedStudent=null;
  render();
}
function classLogPickDate(dateStr){ state.classLogSelectedDate=dateStr; state.classLogSelectedStudent=null; render(); }
function classLogPickStudent(id){ state.classLogSelectedStudent=id||null; render(); }
function classLogView(){
  const [y,m]=state.classLogMonth.split("-").map(Number);

  const daysInMonth=new Date(y,m,0).getDate();
  const dateSet=classLogDatesSet();

      <button class="btn" onclick="classLogMonthShift(-1)">‹ 이전</button>

      detailHtml=`<div class="card">

function bookCard(b){
  const ss=bookSessions(b.id), cov=covered(b.id), p=pct(cov,b.totalPages), st=status(p);
  const total=Math.max(Number(b.totalPages),cov,1);

  const legends=ss.map((s,i)=>`<span class="legend-item"><i class="dot" style="background:${COLORS[i%COLORS.length]}"></i>${esc(s.date.slice(5).replace("-","/"))} · ${s.amount}쪽</span>`).join("");
  const max=Math.max(1,...ss.map(s=>Number(s.amount)));
  const rows=ss.map((s,i)=>`<div class="session-row">
    <b style="color:${COLORS[i%COLORS.length]}">${i+1}회차</b>
    <span class="small">${esc(s.date)}</span>
    <div class="row"><div class="mini-bar grow"><div style="height:100%;width:${Math.max(7,Number(s.amount)/max*100)}%;background:${COLORS[i%COLORS.length]}"></div></div><span>${s.amount}쪽</span></div>
    ${b.status==="active"?`<div class="row"><button class="btn" style="padding:3px 6px" onclick="showSessionEdit('${s.id}','${b.id}')">수정</button><button class="btn" style="padding:3px 6px" onclick="deleteSession('${s.id}')">×</button></div>`:""}
  </div>`).join("");
  return `<div class="card relative">
    ${b.status==="done"?'<div class="stamp">완독</div>':""}
    <div class="row between" style="padding-right:${b.status==="done"?"60px":"0"}">
      <div class="book-name">${esc(b.name)}</div>
      ${b.status==="active"?`<div class="row"><button class="btn" style="padding:5px 8px" onclick="showBookEdit('${b.id}')">수정</button><button class="btn" style="padding:5px 8px" onclick="deleteBook('${b.id}')">삭제</button></div>`:""}
    </div>
    <div id="bookEdit-${b.id}"></div>
    <div class="row between" style="margin-top:8px"><span class="small">${cov} / ${b.totalPages}쪽 · ${ss.length}회 수업</span><span class="badge" style="color:${st[1]}">${st[0]} · ${p}%</span></div>

    <div class="section-title" style="font-size:.95rem;margin:15px 0 7px">날짜별 수업량</div>
    <div class="segmented">${segs}<div style="flex:1"></div></div>
    <div class="legend">${legends||'<span class="small">아직 기록이 없습니다.</span>'}</div>

    <div class="row wrap" style="margin-top:12px">

      <button class="btn gold" onclick="completeBook('${b.id}')">✓ 완료 처리</button>`:`<button class="btn" onclick="uncompleteBook('${b.id}')">↩ 완료 취소 (다시 진행 중으로)</button>`}
      <button class="btn" onclick="toggleSessions('${b.id}')">회차별 기록 보기</button>
    </div>
    <div id="sessionForm-${b.id}"></div>
    <div id="sessions-${b.id}" class="session-list hidden">${rows||'<div class="small">아직 기록된 회차가 없습니다.</div>'}</div>
    <div id="sessionEdit-${b.id}"></div>
  </div>`;
}

function speechToField(targetId, buttonEl, summarize=false){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert("이 기기에서는 음성 인식이 지원되지 않습니다. Chrome에서 열어 주세요."); return; }
  const target=document.getElementById(targetId);
  if(!target) return;
  const rec=new SR();
  rec.lang="ko-KR"; rec.interimResults=false; rec.maxAlternatives=1;
  if(buttonEl){ buttonEl.classList.add("listening"); buttonEl.textContent="🎙 듣는 중"; }
  rec.onresult=e=>{
    let text=(e.results?.[0]?.[0]?.transcript||"").trim();
    if(summarize) text=summarizeSpokenNote(text);
    target.value=(target.value?target.value.trim()+"\n":"")+text;
    target.dispatchEvent(new Event("input",{bubbles:true}));
  };
  rec.onerror=()=>alert("잘 못 알아들었어요. 다시 눌러서 천천히 말해 주세요.");
  rec.onend=()=>{ if(buttonEl){buttonEl.classList.remove("listening");buttonEl.textContent="🎤 말하기";} };
  rec.start();
}
function summarizeSpokenNote(text){
  let t=String(text||"").trim()
    .replace(/\b(어|음|그냥|뭐랄까|그러니까|아무튼|하여간)\b/g," ")
    .replace(/\s+/g," ")
    .replace(/했거든요|했거든|했어요/g,"함")
    .replace(/라고 했어요|라고 했어/g,"라고 함")
    .replace(/말씀하셨어요|말씀하셨어/g,"말씀함")
    .trim();
  // 너무 긴 음성은 문장 앞부분 위주로 핵심 3문장까지 정리
  const parts=t.split(/(?<=[.!?]|다\s|함\s)/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>3) t=parts.slice(0,3).join(" ");
  return t;
}




function progressGraphData(studentId){
  const student=state.students.find(s=>s.id===studentId);
  const now=Date.now(), WEEK=7*24*60*60*1000;
  const active=state.books.filter(b=>b.studentId===studentId && b.status!=="done");
  const recentlyDone=state.books.filter(b=>b.studentId===studentId && b.status==="done" && b.completedDate && (now-new Date(b.completedDate).getTime())<=WEEK);
  const mapBook=(b)=>{
    const total=Math.max(Number(b.totalPages||b.total||0),1);
    const done=Math.max(0,covered(b.id));
    const p=Math.min(100,Math.round(done/total*100));
    const ss=bookSessions(b.id);
    const segments=ss.map((s,i)=>({amount:Number(s.amount)||0,color:COLORS[i%COLORS.length]}));
    return {name:String(b.name||"교재"),done,total,p,done_flag:b.status==="done",segments};
  };
  return {student,books:[...active.map(mapBook),...recentlyDone.map(mapBook)]};
}
function roundRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
}
function progressGraphDataUrl(studentId){
  try{
    const {student,books}=progressGraphData(studentId);
    const W=900, rowH=118, top=150, bottom=46, H=Math.max(330,top+Math.max(1,books.length)*rowH+bottom);
    const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
    ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#234634';ctx.font='700 38px system-ui, sans-serif';ctx.fillText((student?.name||'학생')+' 교재 진도',56,62);
    ctx.fillStyle='#6b6b67';ctx.font='24px system-ui, sans-serif';ctx.fillText('현재 진행 중 교재',56,105);
    if(!books.length){ctx.fillStyle='#777';ctx.font='28px system-ui, sans-serif';ctx.fillText('진행 중인 교재가 없습니다.',56,205);return c.toDataURL('image/png');}
    books.forEach((b,i)=>{
      const y=top+i*rowH;
      drawBookRow(ctx,b,56,y,788);
    });
    return c.toDataURL('image/png');
  }catch(e){return '';}
}
function drawBookRow(ctx,b,x,y,w){
  ctx.textAlign='left';
  ctx.fillStyle='#2f332f';ctx.font='700 29px system-ui, sans-serif';ctx.fillText(b.name,x,y+24);
  ctx.textAlign='right';
  const pctColor=status(b.done_flag?100:b.p)[1];
  ctx.fillStyle=pctColor;ctx.font='800 27px system-ui, sans-serif';ctx.fillText(b.done_flag?'✓ 완료':b.p+'%',x+w,y+24);
  ctx.textAlign='left';
  const bx=x,by=y+45,bw=w,bh=28;
  ctx.fillStyle='#e8e2d4';roundRect(ctx,bx,by,bw,bh,14);ctx.fill();
  if(b.segments&&b.segments.length){
    ctx.save();roundRect(ctx,bx,by,bw,bh,14);ctx.clip();
    let sx=bx;
    b.segments.forEach(seg=>{const segW=bw*(seg.amount/b.total);ctx.fillStyle=seg.color;ctx.fillRect(sx,by,Math.max(0,segW),bh);sx+=segW;});
    ctx.restore();
  }
  ctx.fillStyle='#6b6b67';ctx.font='22px system-ui, sans-serif';
  ctx.fillText(b.done_flag?`완료 · ${b.done} / ${b.total}쪽`:`${b.done} / ${b.total}쪽`,x,y+101);
}

function dataUrlToBlob(dataUrl){const a=dataUrl.split(','),mime=(a[0].match(/:(.*?);/)||[])[1]||'image/png',bin=atob(a[1]),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}

async function buildShareImageUrl(studentId){
  try{
    const student=state.students.find(s=>s.id===studentId);
    const rawText=(document.getElementById('fbPreview')?.textContent||'').trim();
    const hasText=rawText && !rawText.startsWith('회차·');
    const {books}=progressGraphData(studentId);
    const W=900, scale=state.shareFontScale||1;
    const textFont=Math.round(26*scale), lineH=Math.round(textFont*1.55);
    const measure=document.createElement('canvas').getContext('2d');
    measure.font=`400 ${textFont}px system-ui, sans-serif`;
    const maxTextWidth=W-112;
    function wrapLines(str){
      const lines=[];
      String(str||'').split('\n').forEach(par=>{
        if(!par){lines.push('');return;}
        let line='';
        for(const ch of par){
          const test=line+ch;
          if(measure.measureText(test).width>maxTextWidth && line){lines.push(line);line=ch;}
          else line=test;
        }
        lines.push(line);
      });
      return lines;
    }
    const textLines=hasText?wrapLines(rawText):[];
    let logoImg=null;
    try{ logoImg=await loadImagePromise(state.academyLogo||'logo.png'); }catch(e){ logoImg=null; }
    let logoDrawH=0, logoDrawW=0;
    if(logoImg){
      const maxLogoW=460,maxLogoH=90;
      let lw=logoImg.naturalWidth||logoImg.width,lh=logoImg.naturalHeight||logoImg.height;
      const ratio=Math.min(maxLogoW/lw,maxLogoH/lh,1);
      logoDrawW=lw*ratio; logoDrawH=lh*ratio;
    }
    const rowH=118, bottom=46;
    let y=40;
    if(logoImg) y+=logoDrawH+18;
    y+=48; // title
    const textBlockH=hasText?(textLines.length*lineH+26):0;
    y+=textBlockH;
    if(hasText||books.length) y+=22; // divider gap
    const graphTop=y;
    const H=Math.max(330, graphTop+Math.max(1,books.length)*rowH+bottom);
    const c=document.createElement('canvas'); c.width=W; c.height=H; const ctx=c.getContext('2d');
    ctx.fillStyle='#fffdf8'; ctx.fillRect(0,0,W,H);
    let cy=40;
    if(logoImg){ ctx.drawImage(logoImg,(W-logoDrawW)/2,cy,logoDrawW,logoDrawH); cy+=logoDrawH+18; }
    ctx.textAlign='left';
    ctx.fillStyle='#234634'; ctx.font='700 34px system-ui, sans-serif';
    ctx.fillText((student?.name||'학생')+' 학습 안내',56,cy+30);
    cy+=48;
    if(hasText){
      ctx.fillStyle='#2f332f'; ctx.font=`400 ${textFont}px system-ui, sans-serif`;
      textLines.forEach((l,i)=>ctx.fillText(l,56,cy+(i+1)*lineH-lineH*0.3));
      cy+=textLines.length*lineH+26;
    }
    if(hasText||books.length){
      ctx.strokeStyle='#e1dbc9'; ctx.beginPath(); ctx.moveTo(56,cy); ctx.lineTo(W-56,cy); ctx.stroke();
      cy+=22;
    }
    if(!books.length){
      ctx.fillStyle='#777'; ctx.font='28px system-ui, sans-serif'; ctx.fillText('진행 중인 교재가 없습니다.',56,cy+30);
      return c.toDataURL('image/png');
    }
    books.forEach((b,i)=>{ drawBookRow(ctx,b,56,cy+i*rowH,788); });
    return c.toDataURL('image/png');
  }catch(e){ console.warn(e); return ''; }
}

}
async function shareFeedbackWithGraph(studentId){

function normalizeFeedbackText(t, studentName){
  let x=String(t||"").trim().replace(/\s+/g," ");
  if(!x)return "";
  x=x.replace(/\b(어|음|그냥|뭐랄까|그러니까|아무튼|하여간)\b/g," ").replace(/\s+/g," ").trim();
  x=x.replace(/했어(요)?/g,"했어요").replace(/잘했어(요)?/g,"잘했어요").replace(/좋았어(요)?/g,"좋았어요");
  if(!/[.!?~^]$/.test(x)) x += ".";
  if(studentName && !x.includes(studentName)) x=studentName+"이는 "+x;
  return x.replace(/\.\s*/g,". ").trim()+"^^";
}
function speechToFeedback(targetId,buttonEl){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("이 기기에서는 음성 인식이 지원되지 않습니다. Chrome에서 열어 주세요.");return;}
  const target=document.getElementById(targetId),rec=new SR(); rec.lang="ko-KR";rec.interimResults=false;rec.maxAlternatives=1;
  buttonEl.classList.add("listening");buttonEl.textContent="🎙 듣는 중";
  rec.onresult=e=>{const text=(e.results?.[0]?.[0]?.transcript||"").trim();target.value=(target.value?target.value.trim()+" ":"")+text;};
  rec.onerror=()=>alert("잘 못 알아들었어요. 다시 눌러 천천히 말해 주세요.");
  rec.onend=()=>{buttonEl.classList.remove("listening");buttonEl.textContent="🎤 말하기"};rec.start();
}
function feedbackText(student){
  const payDate=document.getElementById("fbPayDate").value;
  const payMethod=document.getElementById("fbPayMethod").value;
  const total=document.getElementById("fbTotal").value.trim();
  const rounds=document.getElementById("fbRounds").value.trim();
  const dates=document.getElementById("fbDates").value.trim();
  const book=document.getElementById("fbBook").value.trim();
  const raw=document.getElementById("fbRaw").value.trim();
  const extra=document.getElementById("fbExtra").value.trim();
  const payAsk=document.getElementById("fbPayAsk").checked;
  const payLabel=payDate?`${payMethod} ${payDate.slice(5).replace("-","/")}`:"";
  let lines=[];
  if(total||payLabel) lines.push(`${student.name} (${total?total+"회":""}${total&&payLabel?" · ":""}${payLabel})`);
  if(rounds||dates) lines.push(`${rounds?rounds+"회차":""}${rounds&&dates?" - ":""}${dates}`);
  if(book) lines.push(`교재 : ${book}`);
  const friendly=normalizeFeedbackText(raw,student.name);
  if(friendly){lines.push("");lines.push(friendly)}
  if(extra){lines.push("");lines.push(extra)}
  if(payAsk){lines.push("");lines.push("결제창 드릴게요. 감사합니다^^")}
  return lines.join("\n").trim();
}

function buildCalendarGrid(monthStr, dayRenderer){
  const [y,m]=monthStr.split("-").map(Number);
  const first=new Date(y,m-1,1), startDow=first.getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push('<div></div>');
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    cells.push(dayRenderer(dateStr,d));
  }
  const dow=['일','월','화','수','목','금','토'];
  return {y,m,cellsHtml:cells.join(""),dowHtml:dow.map(x=>`<div class="small" style="text-align:center;font-weight:700">${x}</div>`).join("")};
}
function calendarMonthShift(key,delta){
  captureFeedbackForm();
  const [y,m]=state[key].split("-").map(Number);

  render();

function formatDatesGrouped(dateStrs){
  const sorted=[...dateStrs].sort();
  const groups=[]; let curMonth=null, curDays=[];
  sorted.forEach(ds=>{
    const [,mm,dd]=ds.split("-").map(Number);
    if(mm!==curMonth){ if(curMonth!==null) groups.push(`${curMonth}/${curDays.join(",")}`); curMonth=mm; curDays=[dd]; }
    else curDays.push(dd);
  });
  if(curMonth!==null) groups.push(`${curMonth}/${curDays.join(",")}`);
  return groups.join(", ");
}

    .replace(/씨/g,"c")
    .replace(/에이/g,"a")
    .replace(/비/g,"b")
    .replace(/디/g,"d")
    .replace(/이/g,"2")
    .replace(/삼/g,"3")
    .replace(/사/g,"4")
    .replace(/오/g,"5")
    .replace(/육/g,"6")
    .replace(/칠/g,"7")
    .replace(/팔/g,"8")
    .replace(/구/g,"9");
}

function hangulDistance(a,b){
  a=nvoice(a); b=nvoice(b);
  const m=a.length,n=b.length;
  if(!m||!n) return Math.max(m,n);
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j]=Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
      );
    }
  }
  return dp[m][n];
}
function bestStudentMatch(text){
  const raw=String(text||"").replace(/\s+/g,"");
  // 1) exact containment
  let exact=state.students.find(s=>nvoice(text).includes(nvoice(s.name)));
  if(exact) return {student:exact,score:0};

  // 2) compare all 2~5 Hangul chunks against existing names
  const chunks=(String(text||"").match(/[가-힣]{2,5}/g)||[]);
  let best=null;
  for(const s of state.students){
    for(const c of chunks){
      const d=hangulDistance(c,s.name);
      const denom=Math.max(String(c).length,String(s.name).length,1);
      const score=d/denom;
      if(!best||score<best.score) best={student:s,score,heard:c};
    }
  }
  // Korean names: tolerate one syllable being misheard in 3-syllable names
  if(best && best.score<=0.34) return best;
  return null;
}
function spokenBookFamily(s){
  return nvoice(s)
    .replace(/[a-d][0-9]+/g,"")
    .replace(/[0-9]+/g,"")
    .replace(/교재|책/g,"");
}

function voiceStudent(t){
  const hit=bestStudentMatch(t);
  return hit ? hit.student : null;
}
function voiceBook(studentId,t){
  const n=nvoice(t);
  const bs=state.books.filter(b=>b.studentId===studentId&&b.status==="active");
  // exact/full book name first
  let exact=bs.slice().sort((a,b)=>String(b.name).length-String(a.name).length)
    .find(b=>n.includes(nvoice(b.name)));
  if(exact) return exact;

  // If user just says "멘사", "퍼즐", etc. and only one active book in that family, use it.
  const families=[];
  for(const b of bs){
    const fam=spokenBookFamily(b.name);
    if(fam && n.includes(fam)) families.push(b);
  }
  if(families.length===1) return families[0];

  // token prefix fallback
  const tokens=(String(t||"").match(/[가-힣A-Za-z]+/g)||[]).map(nvoice).filter(x=>x.length>=2);
  for(const tok of tokens){
    const candidates=bs.filter(b=>nvoice(b.name).includes(tok)||spokenBookFamily(b.name).includes(tok));
    if(candidates.length===1) return candidates[0];
  }
  return null;
}
function koreanCountNumber(raw){
  const table={
    "한":1,"하나":1,"두":2,"둘":2,"세":3,"셋":3,"네":4,"넷":4,
    "다섯":5,"여섯":6,"일곱":7,"여덟":8,"아홉":9,"열":10
  };
  return table[String(raw||"").replace(/\s+/g,"")] ?? null;
}
function voiceProgress(t,bookId){
  function unitToPages(n,unit){ return unit==="장" ? n*2 : n; }

  // 누적 표현: "30쪽까지", "세 장까지" → 장은 2쪽으로 환산한 누적 목표
  let m=t.match(/(\d+)\s*(쪽|장)\s*까지/);
  if(m){
    const target=unitToPages(Number(m[1]),m[2]), prev=covered(bookId);
    return {amount:target-prev,mode:"target",target,prev,spokenUnit:m[2]};
  }
  m=t.match(/(한|하나|두|둘|세|셋|네|넷|다섯|여섯|일곱|여덟|아홉|열)\s*(쪽|장)\s*까지/);
  if(m){
    const target=unitToPages(koreanCountNumber(m[1]),m[2]), prev=covered(bookId);
    return {amount:target-prev,mode:"target",target,prev,spokenUnit:m[2]};
  }

  // 오늘 진행량: "3장"=6쪽, "세 장"=6쪽
  m=t.match(/(\d+)\s*(쪽|장)/);
  if(m) return {amount:unitToPages(Number(m[1]),m[2]),mode:"amount",spokenUnit:m[2],spokenCount:Number(m[1])};

  m=t.match(/(한|하나|두|둘|세|셋|네|넷|다섯|여섯|일곱|여덟|아홉|열)\s*(쪽|장)/);
  if(m){
    const count=koreanCountNumber(m[1]);
    return {amount:unitToPages(count,m[2]),mode:"amount",spokenUnit:m[2],spokenCount:count};
  }
  return null;
}

function parseVoiceStudentRegistration(text){
  let t=String(text||"").trim()
    .replace(/등록해\s*줘|등록해줘|등록해주세요|등록해\s*주세요|추가해\s*줘|추가해줘|추가해주세요|추가해\s*주세요/g,"등록")
    .replace(/[,.!?]/g," ")
    .replace(/\s+/g," ")
    .trim();

  // Strongest patterns first, so the word "학생" is never captured as the name.
  let m=t.match(/(?:새로운|새)\s*학생\s+([가-힣]{2,5})(?:\s|$)/);
  if(m && m[1]!=="학생") return m[1];

  m=t.match(/학생\s+([가-힣]{2,5})\s*(?:등록|추가)/);
  if(m && m[1]!=="학생") return m[1];

  m=t.match(/([가-힣]{2,5})\s*학생\s*(?:등록|추가)/);
  if(m && m[1]!=="학생") return m[1];

  m=t.match(/^([가-힣]{2,5})\s*(?:등록|추가)/);
  if(m && m[1]!=="학생") return m[1];

  return null;
}

function extractVoiceNote(text, studentName){
  let t=String(text||"").trim();
  const hasNote=/(상담|특이\s*사항|특이사항|상담\s*기록|메모)/.test(t);
  if(!hasNote) return null;
  // 학생 이름, 명령어, 날짜 표현을 제거하고 실제 내용만 남김
  t=t.replace(new RegExp(studentName,"g"),"")
     .replace(/상담\s*기록|상담|특이\s*사항|특이사항|메모/g,"")
     .replace(/오늘(은)?/g,"")
     .replace(/기록해\s*줘|기록해줘|적어\s*줘|적어줘|저장해\s*줘|저장해줘/g,"")
     .replace(/^[\s,.:;-]+|[\s,.:;-]+$/g,"")
     .trim();
  return t || null;
}
function parseKoreanMoney(text){
  const t=String(text||"").replace(/,/g,"").replace(/\s+/g,"");
  let m=t.match(/(\d+)만(\d+)?천?원?/);
  if(m){
    const man=Number(m[1]||0)*10000;
    let rest=0;
    if(m[2]) rest=Number(m[2])*1000;
    return man+rest;
  }
  m=t.match(/(\d+)만원/);
  if(m) return Number(m[1])*10000;
  m=t.match(/(\d+)천원/);
  if(m) return Number(m[1])*1000;
  m=t.match(/(\d{4,})원?/);
  if(m) return Number(m[1]);
  return null;
}
function handleVoiceNoteOrPayment(text, student){
  const note=extractVoiceNote(text,student.name);
  if(note){
    showVoiceReview({type:"note",studentId:student.id,date:today(),text:note});
    return true;
  }
  if(/(결제|수강료|입금|카드)/.test(text)){
    const amount=parseKoreanMoney(text);
    let memo=String(text||"")
      .replace(new RegExp(student.name,"g"),"")
      .replace(/오늘(은)?/g,"")
      .replace(/결제했어|결제했어요|결제|입금했어|입금했어요|입금|수강료|카드로|카드/g,"")
      .replace(/[0-9,\s]*(만|천)?원/g,"")
      .replace(/^[\s,.:;-]+|[\s,.:;-]+$/g,"")
      .trim();
    if(!amount){
      voiceStatus(`${esc(student.name)} 학생 결제 명령은 들었는데 금액을 알아듣지 못했어요.`);
      return true;
    }
    showVoiceReview({type:"payment",studentId:student.id,date:today(),amount,memo:memo||""});
    return true;
  }
  return false;
}

function handleVoiceCommand(text){
  const registerName=parseVoiceStudentRegistration(text);
  if(registerName){
    showVoiceReview({type:"student",name:registerName});
    return;
  }
  const s=voiceStudent(text);
  if(!s){
    const guess=bestStudentMatch(text);
    if(guess&&guess.student){
      voiceStatus(`“${esc(text)}” → 혹시 <strong>${esc(guess.student.name)}</strong> 학생인가요? 다시 한 번 말씀해 주세요.`);
    }else{
      voiceStatus(`“${esc(text)}” → 학생 이름을 찾지 못했어요.`);
    }
    return;
  }
  if(handleVoiceNoteOrPayment(text,s)) return;

  // "멘사 완료했어", "멘사 끝냈어", "이 책 완료" 등의 완료 명령
  if(/(완료|완독|끝냈|끝내|다\s*했|다했)/.test(text)){
    const doneBook=voiceBook(s.id,text);
    if(doneBook){
      showVoiceCompleteReview(s,doneBook);
      return;
    }
  }

  const b=voiceBook(s.id,text);
  if(!b){
    const names=state.books.filter(x=>x.studentId===s.id&&x.status==="active").map(x=>x.name).join(", ");
    voiceStatus(`“${esc(text)}” → ${esc(s.name)} 학생 교재를 찾지 못했어요. 진행 중: ${esc(names||"없음")}`); return;
  }
  const p=voiceProgress(text,b.id);
  if(!p||!p.amount||p.amount<=0){
    if(p&&p.mode==="target"&&p.amount===0) voiceStatus(`${esc(s.name)} · ${esc(b.name)}은 이미 ${p.target}쪽까지 기록돼 있어요.`);
    else if(p&&p.mode==="target"&&p.amount<0) voiceStatus(`${esc(s.name)} · ${esc(b.name)}은 현재 ${p.prev}쪽까지예요.`);
    else voiceStatus(`“${esc(text)}” → 몇 쪽 했는지 알아듣지 못했어요.`);
    return;
  }
  showVoiceReview({
    type:"session",
    studentId:s.id,
    bookId:b.id,
    date:today(),
    amount:p.amount
  });
}
function undoVoiceRecord(){
  if(!lastVoiceSessionId)return;
  state.sessions=state.sessions.filter(s=>s.id!==lastVoiceSessionId);
  lastVoiceSessionId=null; save(); render(); voiceStatus("방금 음성 기록을 취소했어요.");

/* ===== 클라우드 저장(Firebase) ===== */
const CLOUD_KEY="academy-cloud-v1";
const FIREBASE_CONFIG={
  apiKey: "AIzaSyDKwOMfZUsubJPJgknPv6YRYcczd3fy_HQ",
  authDomain: "saenggo-app.firebaseapp.com",
  projectId: "saenggo-app",
  storageBucket: "saenggo-app.firebasestorage.app",
  messagingSenderId: "150625328778",
  appId: "1:150625328778:web:f44264549d3a233ed29773"
};
let cloudApp=null, cloudAuth=null, cloudDb=null, cloudUser=null, cloudSyncTimer=null, cloudStatusMsg="", cloudAuthChecked=false;
function cloudCfg(){ return {config:FIREBASE_CONFIG}; }
function cloudSaveCfg(c){ localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); }
function loadScriptOnce(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[data-src="${src}"]`)) return res();
    const s=document.createElement("script"); s.src=src; s.dataset.src=src;
    s.onload=()=>res(); s.onerror=()=>rej(new Error("load fail: "+src));
    document.head.appendChild(s);
  });
}
async function cloudInit(){
  const cfg=cloudCfg();
  if(!cfg||!cfg.config) return false;
  if(cloudApp) return true;
  try{
    await loadScriptOnce("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
    await loadScriptOnce("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js");
    await loadScriptOnce("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
    cloudApp=firebase.initializeApp(cfg.config);
    cloudAuth=firebase.auth(); cloudDb=firebase.firestore();
    cloudAuth.onAuthStateChanged(async(user)=>{
      cloudUser=user;
      cloudAuthChecked=true;
      if(user){ await cloudPullOnLogin(); }
      render();
    });
    return true;
  }catch(e){ cloudStatusMsg="클라우드 연결 실패: "+e.message; cloudAuthChecked=true; render(); return false; }
}
function cloudMaybeAutoLogin(){ cloudInit(); }
async function cloudSaveConfig(){
  const raw=document.getElementById("cloudConfigInput")?.value||"";
  try{
    const config=JSON.parse(raw);
    cloudSaveCfg({config});
    cloudApp=null; cloudAuth=null; cloudDb=null;
    const ok=await cloudInit();
    cloudStatusMsg=ok?"클라우드 설정을 저장했어요. 이제 로그인 해주세요.":"설정을 다시 확인해 주세요.";
  }catch(e){ alert("Firebase 설정 형식이 올바르지 않아요. { } 형태의 JSON 전체를 붙여넣어 주세요."); return; }
  render();
}
async function cloudSignUp(){
  const email=document.getElementById("cloudEmail")?.value.trim();
  const pw=document.getElementById("cloudPw")?.value;
  if(!email||!pw||pw.length<6) return alert("이메일과 6자 이상 비밀번호를 입력해 주세요.");
  try{ await cloudAuth.createUserWithEmailAndPassword(email,pw); }
  catch(e){ alert("가입 실패: "+e.message); }
}
async function cloudLogin(){
  const email=document.getElementById("cloudEmail")?.value.trim();
  const pw=document.getElementById("cloudPw")?.value;
  if(!email||!pw) return alert("이메일과 비밀번호를 입력해 주세요.");
  try{ await cloudAuth.signInWithEmailAndPassword(email,pw); }
  catch(e){ alert("로그인 실패: "+e.message); }
}
async function cloudLogout(){
  try{ await cloudAuth.signOut(); }catch(e){}
  state={...state,students:[],books:[],sessions:[],notes:[],payments:[],feedbacks:[],commonNotice:"",academyLogo:null,shareFontScale:1,selectedId:null,showCloud:false,showClassLog:false};
  render();
}
async function cloudPullOnLogin(){
  try{
    const doc=await cloudDb.collection("academy_data").doc(cloudUser.uid).get();
    if(doc.exists){
      const d=doc.data();
      state={...state,students:d.students||[],books:d.books||[],sessions:d.sessions||[],notes:d.notes||[],payments:d.payments||[],feedbacks:d.feedbacks||[],commonNotice:d.commonNotice||"",academyLogo:d.academyLogo||null,shareFontScale:Number(d.shareFontScale)||1};
      localStorage.setItem(KEY,JSON.stringify({students:state.students,books:state.books,sessions:state.sessions,notes:state.notes,payments:state.payments,feedbacks:state.feedbacks,commonNotice:state.commonNotice,academyLogo:state.academyLogo,shareFontScale:state.shareFontScale}));
      cloudStatusMsg="클라우드에서 자료를 불러왔어요.";
    }else{
      state={...state,students:[],books:[],sessions:[],notes:[],payments:[],feedbacks:[],commonNotice:"",academyLogo:null,shareFontScale:1};
      localStorage.setItem(KEY,JSON.stringify({students:[],books:[],sessions:[],notes:[],payments:[],feedbacks:[],commonNotice:"",academyLogo:null,shareFontScale:1}));
      await cloudPushNow();
      cloudStatusMsg="새 계정을 만들었어요.";
    }
  }catch(e){ cloudStatusMsg="불러오기 실패: "+e.message; }
}
async function cloudPushNow(){
  if(!cloudDb||!cloudUser) return;
  const payload={students:state.students,books:state.books,sessions:state.sessions,notes:state.notes,payments:state.payments,feedbacks:state.feedbacks,commonNotice:state.commonNotice,academyLogo:state.academyLogo||null,shareFontScale:state.shareFontScale||1,updatedAt:Date.now()};
  try{ await cloudDb.collection("academy_data").doc(cloudUser.uid).set(payload); cloudStatusMsg="클라우드에 저장했어요 · "+new Date().toLocaleTimeString("ko-KR"); }
  catch(e){ cloudStatusMsg="클라우드 저장 실패: "+e.message; }
  render();
}
function cloudQueueSync(){
  if(!cloudDb||!cloudUser) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(()=>cloudPushNow(),1500);
}
function showCloudPanel(){ state.showCloud=true; state.selectedId=null; state.showClassLog=false; state.showLogo=false; render(); window.scrollTo(0,0); }
function cloudView(){
  const cfg=cloudCfg();
  let body="";
  if(!cfg||!cfg.config){
    body=`<div class="small" style="margin-bottom:10px;line-height:1.7">클라우드 저장은 무료 Firebase 계정 1개가 필요해요.<br>
    1) firebase.google.com/ 접속 → 프로젝트 만들기<br>
    2) 왼쪽 메뉴 Authentication → 로그인 방법 → 이메일/비밀번호 사용 설정<br>
    3) 왼쪽 메뉴 Firestore Database → 만들기(테스트 모드로 시작)<br>
    4) 프로젝트 설정(⚙️) → 내 앱 추가(웹 </>) → 나오는 firebaseConfig { ... } 전체를 복사해서 아래에 붙여넣기</div>
    <textarea id="cloudConfigInput" class="input" style="min-height:110px" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...", ...}'></textarea>
    <div class="row wrap" style="margin-top:8px"><button class="btn primary" onclick="cloudSaveConfig()">클라우드 설정 저장</button></div>`;
  }else if(!cloudUser){
    body=`<div class="field"><label>이메일</label><input id="cloudEmail" class="input" type="email" placeholder="you@example.com"></div>
    <div class="field" style="margin-top:8px"><label>비밀번호 (6자 이상)</label><input id="cloudPw" class="input" type="password"></div>
    <div class="row wrap" style="margin-top:10px"><button class="btn primary" onclick="cloudLogin()">로그인</button><button class="btn" onclick="cloudSignUp()">처음이라면 계정 만들기</button></div>`;
  }else{
    body=`<div class="notice">✅ ${esc(cloudUser.email)} 로 로그인됨</div>
    <div class="row wrap" style="margin-top:10px"><button class="btn primary" onclick="cloudPushNow()">지금 클라우드에 저장</button><button class="btn" onclick="cloudLogout()">로그아웃</button></div>`;
  }
  return `<div class="row between wrap" style="margin-bottom:10px"><div class="section-title" style="margin:0">☁️ 클라우드 저장</div><button class="btn" onclick="goStudentListTop()">← 학생 목록</button></div>
  <div class="card">${body}${cloudStatusMsg?`<div class="small" style="margin-top:10px">${esc(cloudStatusMsg)}</div>`:""}</div>`;
}
